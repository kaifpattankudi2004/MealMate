{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Restaurant - MealMate Admin</title>
    <link rel="stylesheet" href="{% static 'delivery/styletheme.css' %}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">🍔 <span>MealMate Admin</span></a>
        <div class="user-badge">
            👤 Administrator
        </div>
    </nav>

    <main class="page-container">
        <div class="form-card">
            <h2 class="form-title">Edit Restaurant</h2>
            <p class="form-subtitle">Update details for {{ restaurant.name }}</p>

            <form action="{% url 'update_restaurant' restaurant.id %}" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="name">Restaurant Name</label>
                    <input type="text" id="name" name="name" class="form-control" value="{{ restaurant.name }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="picture">Picture URL</label>
                    <input type="url" id="picture" name="picture" class="form-control" value="{{ restaurant.picture }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="cuisine">Cuisine Type</label>
                    <input type="text" id="cuisine" name="cuisine" class="form-control" value="{{ restaurant.cuisine }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="rating">Rating (0 - 5)</label>
                    <input type="number" id="rating" name="rating" min="0" max="5" step="0.1" class="form-control" value="{{ restaurant.rating }}" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Update Restaurant</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MealMate. All rights reserved.</p>
    </footer>
</body>
</html>
