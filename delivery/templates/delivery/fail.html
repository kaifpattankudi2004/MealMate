{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Failed - MealMate</title>
    <link rel="stylesheet" href="{% static 'delivery/styletheme.css' %}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">🍔 <span>MealMate</span></a>
    </nav>

    <main class="page-container">
        <div class="status-card status-fail">
            <div class="status-icon">✕</div>
            <h1 class="status-title">Login Failed</h1>
            <p class="status-desc">Invalid username or password. Please check your credentials and try again.</p>
            <a href="{% url 'open_signin' %}" class="btn btn-primary">Try Again</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MealMate. All rights reserved.</p>
    </footer>
</body>
</html>
