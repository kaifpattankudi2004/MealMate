{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Restaurant - MealMate Admin</title>
    <link rel="stylesheet" href="{% static 'delivery/styletheme.css' %}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">🍔 <span>MealMate Admin</span></a>
        <div class="user-badge">
            👤 Administrator
        </div>
    </nav>

    <main class="page-container">
        <div class="form-card">
            <h2 class="form-title">Add New Restaurant</h2>
            <p class="form-subtitle">Register a new restaurant partner</p>

            <form action="{% url 'add_restaurant' %}" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="name">Restaurant Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Spice Garden" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="picture">Picture URL</label>
                    <input type="url" id="picture" name="picture" class="form-control" placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-group">
                    <label class="form-label" for="cuisine">Cuisine Type</label>
                    <input type="text" id="cuisine" name="cuisine" class="form-control" placeholder="e.g. North Indian, Italian, Chinese" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="rating">Rating (0 - 5)</label>
                    <input type="number" id="rating" name="rating" min="0" max="5" step="0.1" class="form-control" placeholder="4.5" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Add Restaurant</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MealMate. All rights reserved.</p>
    </footer>
</body>
</html>
